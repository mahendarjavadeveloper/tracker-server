spring.application.name=tracker-server
spring.main.banner-mode=off
spring.datasource.url=${TIDB_URL}
spring.datasource.username=${TIDB_USERNAME:${TIDB_USER}}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRE_MS:${JWT_EXPIRE:86400000}}
app.device.offline-after-seconds=${DEVICE_OFFLINE_SECONDS:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.ip-geolocation.enabled=${IP_GEOLOCATION_ENABLED:true}
app.ip-geolocation.base-url=${IP_GEOLOCATION_BASE_URL:https://ipwho.is}
app.ip-geolocation.timeout-millis=${IP_GEOLOCATION_TIMEOUT_MILLIS:3000}
logging.level.root=ERROR
logging.level.com.tracker.server=ERROR
logging.file.name=${TRACKER_SERVER_LOG_FILE:logs/windows-tracker-server.log}
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=6MB
