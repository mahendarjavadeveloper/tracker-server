spring.application.name=tracker-server
spring.datasource.url=${TIDB_URL}
spring.datasource.username=${TIDB_USERNAME:${TIDB_USER}}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRE_MS:${JWT_EXPIRE:86400000}}
app.device.offline-after-seconds=${DEVICE_OFFLINE_SECONDS:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
