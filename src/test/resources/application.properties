spring.datasource.url=jdbc:h2:mem:tracker;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.main.banner-mode=off
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=test-only-secret-key-with-at-least-thirty-two-bytes
jwt.expiration-ms=86400000
app.device.offline-after-seconds=30
app.cors.allowed-origins=http://localhost:3000
app.ip-geolocation.enabled=false
logging.level.root=ERROR
logging.level.com.tracker.server=ERROR
logging.file.name=${java.io.tmpdir}/windows-tracker-server-test.log
